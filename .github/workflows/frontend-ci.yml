name: Frontend CI

# This tells GitHub WHEN to run this pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# This tells GitHub WHAT to do
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Runs on a temporary Linux machine

    steps:
      # 1. Grabs your code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installs Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Use the version you use locally (18 or 20 usually)
          cache: 'npm'

      # 3. Installs your packages
      - name: Install dependencies
        run: npm install --no-save 

      # 4. Runs the linter you just tested
      - name: Run ESLint
        run: npm run lint

      # 5. Runs the build process you just tested
      - name: Test Build
        run: npm run build